  <title>Hermes Agent Harness — Reference Architecture</title>
  <desc>4-layer Hermes multi-agent harness architecture. Layers: Runtime, Capabilities, Orchestration, Safety and Scale. The AI model (Claude API) is the core; these layers constitute the harness that wraps it.</desc>

  <defs>
