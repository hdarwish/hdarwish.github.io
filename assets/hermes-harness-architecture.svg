      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="33%"  stop-color="#a78bfa"/>
      <stop offset="67%"  stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

