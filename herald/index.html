<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herald — Redirecting...</title>
    <meta http-equiv="refresh" content="0; url=https://herald.hafs.dev/">
    <link rel="canonical" href="https://herald.hafs.dev/">
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        a {
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.2);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s ease;
        }
        a:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .spinner {
            width: 40px;
            height: 40px;
            margin: 1rem auto;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Herald has moved!</h1>
        <div class="spinner"></div>
        <p>You are being redirected to the new Herald location...</p>
        <p>
            If you are not redirected automatically,
            <a href="https://herald.hafs.dev/">click here to visit Herald</a>
        </p>
    </div>
    <script>
        // Immediate redirect as backup to meta refresh
        window.location.href = 'https://herald.hafs.dev/';
    </script>
</body>
</html>
