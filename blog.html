<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Insights - Hafs Ibrahim</title>
    <meta name="description" content="AI, engineering, systems & the occasional unhinged opinion on software architecture. By Hafs Ibrahim.">
    <meta property="og:title" content="Daily Insights — Hafs Ibrahim's Blog">
    <meta property="og:description" content="AI, engineering, systems & the occasional unhinged opinion on software architecture.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hdarwish.github.io/blog.html">
    <meta property="og:image" content="https://hdarwish.github.io/og-blog.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Daily Insights — Hafs Ibrahim's Blog">
    <meta name="twitter:description" content="AI, engineering, systems & the occasional unhinged opinion on software architecture.">
    <meta name="twitter:image" content="https://hdarwish.github.io/og-blog.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .blog-hero {
            padding: 8rem 0 3rem;
            text-align: center;
            position: relative;
        }
        .blog-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at 50% 0%, var(--accent-glow) 0%, transparent 70%);
            pointer-events: none;
        }
        .blog-hero h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.75rem;
        }
        .blog-hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto 1.5rem;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 10px 24px;
            border-radius: 8px;
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            font-family: var(--font);
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.1);
        }
        .blog-posts {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1.5rem 2rem;
        }
        .blog-card {
            display: block;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            transition: border-color 0.3s, transform 0.2s;
            text-decoration: none;
            color: inherit;
        }
        .blog-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .blog-card-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }
        .blog-card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .blog-card-tag {
            font-size: 0.7rem;
            font-family: 'JetBrains Mono', monospace;
            padding: 3px 10px;
            border-radius: 20px;
            background: var(--accent-glow);
            color: var(--accent-hover);
        }
        .blog-card-title {
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }
        .blog-card-excerpt {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.7;
        }
        .blog-card-read {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 1rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--accent);
            transition: gap 0.2s;
        }
        .blog-card:hover .blog-card-read {
            gap: 0.7rem;
        }

        /* Pagination */
        .blog-pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            padding: 2rem 1.5rem 4rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .blog-pagination button {
            padding: 8px 20px;
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .blog-pagination button:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }
        .blog-pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .blog-pagination .page-info {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .no-posts {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }
        .no-posts p {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        @media (max-width: 768px) {
            .blog-card {
                padding: 1.25rem;
            }
            .blog-card-title {
                font-size: 1.15rem;
            }
        }
    </style>
</head>
<body>
    <nav class="nav" id="nav">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">H<span class="accent">.</span>I</a>
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#experience">Experience</a></li>
                <li><a href="index.html#projects">Projects</a></li>
                <li><a href="index.html#skills">Skills</a></li>
                <li><a href="blog.html" class="active">Blog</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </div>
    </nav>

    <header class="blog-hero">
        <div class="container">
            <h1>Daily Insights<span class="accent">.</span></h1>
            <p>Curated tech knowledge and interesting discussions from across the web</p>
            <a href="index.html" class="back-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Back to Portfolio
            </a>
        </div>
    </header>

    <main class="blog-posts" id="blog-posts">
        <noscript>
            <div class="no-posts">
                <p>JavaScript is required to load blog posts.</p>
            </div>
        </noscript>
    </main>

    <div class="blog-pagination" id="blog-pagination" style="display:none;">
        <button id="prev-btn" onclick="changePage(-1)">← Newer</button>
        <span class="page-info" id="page-info"></span>
        <button id="next-btn" onclick="changePage(1)">Older →</button>
    </div>

    <footer class="footer">
        <div class="container">
            <p>Built by Hafs Ibrahim</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        const POSTS_PER_PAGE = 7;
        let allPosts = [];
        let currentPage = 1;
        let totalPages = 1;

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            const [year, month, day] = dateStr.split('-').map(Number);
            const date = new Date(year, month - 1, day);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function renderPosts() {
            const container = document.getElementById('blog-posts');
            const start = (currentPage - 1) * POSTS_PER_PAGE;
            const end = start + POSTS_PER_PAGE;
            const pagePosts = allPosts.slice(start, end);

            if (pagePosts.length === 0) {
                container.innerHTML = '<div class="no-posts"><p>No posts yet.</p><span>Check back soon.</span></div>';
                document.getElementById('blog-pagination').style.display = 'none';
                return;
            }

            let html = '';
            for (const post of pagePosts) {
                const tagsHtml = post.tags.map(t =>
                    `<span class="blog-card-tag">${escapeHtml(t)}</span>`
                ).join('');

                html += `
                <a href="blog/${post.date}.html" class="blog-card">
                    <div class="blog-card-date">${formatDate(post.date)}</div>
                    <div class="blog-card-tags">${tagsHtml}</div>
                    <h2 class="blog-card-title">${escapeHtml(post.title)}</h2>
                    <p class="blog-card-excerpt">${escapeHtml(post.excerpt)}</p>
                    <span class="blog-card-read">Read more →</span>
                </a>`;
            }
            container.innerHTML = html;

            // Pagination controls
            const pagination = document.getElementById('blog-pagination');
            if (totalPages > 1) {
                pagination.style.display = 'flex';
                document.getElementById('page-info').textContent = `${currentPage} / ${totalPages}`;
                document.getElementById('prev-btn').disabled = currentPage <= 1;
                document.getElementById('next-btn').disabled = currentPage >= totalPages;
            } else {
                pagination.style.display = 'none';
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderPosts();
            }
        }

        // Load posts
        fetch('blog/posts.json')
            .then(r => r.json())
            .then(posts => {
                allPosts = posts.sort((a, b) => b.date.localeCompare(a.date));
                totalPages = Math.ceil(allPosts.length / POSTS_PER_PAGE);
                renderPosts();
            })
            .catch(() => {
                document.getElementById('blog-posts').innerHTML =
                    '<div class="no-posts"><p>Failed to load posts.</p></div>';
            });
    </script>
</body>
</html>
